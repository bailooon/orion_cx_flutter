# Serves the Flutter web bundle. The app talks to the gateway directly at
# ORION_API_URL, so this server only ships static files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web is a single-page app: unknown paths must return index.html
    # instead of a 404, or a reload on a deep link breaks the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache aggressively.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # index.html and the service worker must never be cached, otherwise a new
    # deploy keeps serving the previous bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
